# galata-research: the record galata-datawatch keeps, loaded as polars or
# DuckDB, explored in marimo. It reads the record and links no Rust crate.

[project]
name = "galata-research"
version = "0.1.0"
description = "Galata's research environment over the galata-datawatch record"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE-MIT"]
dependencies = [
    "polars>=1.21",
    "duckdb>=1.1",
    "pyarrow>=17",
    "marimo>=0.9",
    "altair>=5",
]

[project.scripts]
# The one command that downloads: published archives into the reference store (settled point 8).
galata-fetch = "galata_research.reference.fetch:main"

[project.optional-dependencies]
# Fitted models (gr.models): arch and scipy bring numpy; the core never imports them.
models = ["arch>=8", "scipy>=1.8"]
# Exchange sessions and closures (gr.calendar), maintained upstream, never typed in here.
calendars = ["exchange_calendars>=4.13"]

[dependency-groups]
dev = [
    "pytest>=8",
    # Only to cross-check the Reality Check against a reference; the library itself stays free of numpy.
    "arch>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galata_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests are named after the claim they defend, as in galata-datawatch's
# py/pyproject.toml, so pytest collects them by that shape.
python_files = ["*.py"]
python_functions = ["a_*", "an_*", "the_*", "every_*", "no_*"]
markers = ["record: reads the real record under the resolved root; skipped when it is absent"]
